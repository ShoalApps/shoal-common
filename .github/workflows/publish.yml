name: Publish shared UI

on:
  push:
    branches: [main]
    # Only real library changes: a README edit shouldn't rebuild every app.
    paths: ["ui/**", "expressive/**", ".github/scripts/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", "gradle.properties"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize metadata updates; do not cancel a publication halfway through.
concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Like the apps, use the Android SDK preinstalled on ubuntu-latest.
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the accumulated Maven repository before publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # Never seed from a restored build cache: the branch is authoritative.
          rm -rf build/repo
          if git ls-remote --exit-code --heads origin refs/heads/maven > build/maven-ref; then
            git fetch origin refs/heads/maven:refs/remotes/origin/maven
            git worktree add --detach build/maven origin/maven
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach build/maven HEAD
            git -C build/maven switch --orphan maven
          fi
          mkdir -p build/repo
          rsync -a --exclude='.git' build/maven/ build/repo/

      - name: Test, build and publish into the accumulated repository
        run: ./gradlew :ui:test :ui:assembleRelease :expressive:assembleRelease publishReleasePublicationToPagesRepository

      - name: Preserve immutable versions and update the latest marker
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: python3 .github/scripts/merge-maven-repo.py build/repo build/maven "$VERSION"

      - name: Push the Maven branch
        working-directory: build/maven
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish shoal-ui 1.0.${{ github.run_number }}"
          git push origin HEAD:refs/heads/maven
